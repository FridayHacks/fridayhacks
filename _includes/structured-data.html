<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": {% if page.layout == 'post' %}"BlogPosting"{% else %}"WebPage"{% endif %},
  "@id": {{ canonical | jsonify }},
  "url": {{ canonical | jsonify }},
  "name": {{ seo_title | jsonify | replace: '<', '\u003c' }},
  "description": {{ seo_description | jsonify | replace: '<', '\u003c' }},
  "inLanguage": "en",
  "image": {{ seo_image | jsonify }},
  "isPartOf": {
    "@type": "WebSite",
    "@id": {{ '/' | absolute_url | append: '#website' | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }},
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | jsonify }}
  }{% if page.layout == 'post' %},
  "headline": {{ page.title | jsonify | replace: '<', '\u003c' }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.modified | default: page.date | date_to_xmlschema | jsonify }},
  "mainEntityOfPage": {{ canonical | jsonify }},
  "author": {
    "@type": "Organization",
    "name": {{ site.owner.name | jsonify }},
    "url": {{ '/about/' | absolute_url | jsonify }}
  }{% endif %}
}
</script>
